    <script>
      (function () {
        var shouldSilence = function (first) {
          return (
            first.indexOf('Created TensorFlow Lite XNNPACK delegate') !== -1 ||
            first.indexOf('Graph successfully started running') !== -1 ||
            first.indexOf('gl_context.cc') !== -1 ||
            first.indexOf('inference_feedback_manager.cc') !== -1 ||
            first.indexOf('INFO:') === 0 ||
            first.indexOf('I0000 ') === 0 ||
            first.indexOf('W0000 ') === 0
          );
        };
        var origErr = console.error.bind(console);
        var origWarn = console.warn.bind(console);
        var origLog = console.log.bind(console);
        console.error = function () {
          var first = arguments[0] ? String(arguments[0]) : '';
          if (shouldSilence(first)) return;
          return origErr.apply(console, arguments);
        };
        console.warn = function () {
          var first = arguments[0] ? String(arguments[0]) : '';
          if (shouldSilence(first)) return;
          return origWarn.apply(console, arguments);
        };
        console.log = function () {
          var first = arguments[0] ? String(arguments[0]) : '';
          if (shouldSilence(first)) return;
          return origLog.apply(console, arguments);
        };
      })();
    </script>
