<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Radar & Connectivity Ring Orbits -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366F1" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="210" fill="url(#glowGrad)"/>

  <!-- NFC / Radar Pulse Nodes -->
  <circle cx="256" cy="76" r="10" fill="#06B6D4"/>
  <circle cx="436" cy="256" r="8" fill="#6366F1"/>
  <circle cx="120" cy="380" r="8" fill="#10B981"/>

  <!-- Central 'Y' Monogram Geometry -->
  <g filter="url(#glow)">
    <path d="M 160 140 L 256 280 L 352 140 L 400 140 L 284 308 L 284 410 L 228 410 L 228 308 L 112 140 Z" fill="url(#brandGrad)"/>
  </g>
</svg>
